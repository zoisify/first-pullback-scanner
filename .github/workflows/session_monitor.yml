name: Session Monitor (7–10 AM ET)

# Starts at 11:05 UTC (just after pre-market scan)
# Runs until 10:00 AM ET = 14:00 UTC
# The Python script itself enforces the 10:00 AM hard cutoff
on:
  schedule:
    - cron: '5 11 * * 1-5'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # 3 hours — covers 7:05 AM to 10:05 AM ET

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run session monitor (polls every 60s until 10:00 AM ET)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main_session.py

      - name: Ensure logs directory exists
        run: mkdir -p logs

      - name: Upload session log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-log-${{ github.run_id }}
          path: logs/
          retention-days: 30
          if-no-files-found: warn
