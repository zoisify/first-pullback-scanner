name: Pre-Market Finviz Session

on:
  schedule:
    - cron: '5 11 * * 1-5'
  workflow_dispatch: {}

jobs:
  premarket_session:
    runs-on: ubuntu-latest

   env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build watchlist from Finviz
        run: python build_watchlist.py

      - name: Run session monitor
        run: python main_session.py
