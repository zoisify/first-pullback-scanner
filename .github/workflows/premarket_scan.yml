name: Pre-Market Finviz Session

on:
  schedule:
    # 7:05 AM US Eastern (11:05 UTC) – adjust if you want
    - cron: '5 11 * * 1-5'
  workflow_dispatch: {}

jobs:
  premarket_session:
    runs-on: ubuntu-latest

    env:
      # Match your actual secret names
      APCA_API_KEY_ID:       ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY:   ${{ secrets.APCA_API_SECRET_KEY }}
      DISCORD_WEBHOOK_URL:   ${{ secrets.DISCORD_WEBHOOK_URL }}
      # If your code needs a base URL, hardcode or add a secret:
      APCA_API_BASE_URL:     https://paper-api.alpaca.markets

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build watchlist from Finviz
        run: python build_watchlist.py

      - name: Run session monitor
        run: python main_session.py